<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardware List Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      background: #111;
      color: white;
      padding: 20px 24px;
      border-radius: 12px 12px 0 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header span { font-size: 22px; }

    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px 6px;
      margin: -4px -6px;
      transition: background 0.15s;
    }

    .header-title-wrap:hover { background: rgba(255,255,255,0.1); }

    .header-title-wrap .edit-hint {
      font-size: 11px;
      color: #777;
      opacity: 0;
      transition: opacity 0.15s;
      margin-left: 4px;
    }

    .header-title-wrap:hover .edit-hint { opacity: 1; }

    .header-edit-row {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .header-edit-row input {
      font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      padding: 6px 10px;
      outline: none;
      width: auto;
    }

    .header-edit-row input::placeholder { color: rgba(255,255,255,0.4); }
    .header-edit-row input:focus { border-color: white; }

    .emoji-input { width: 64px !important; text-align: center; font-size: 18px !important; }

    .save-title-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .save-title-btn:hover { background: rgba(255,255,255,0.35); }

    .header-right {
      margin-left: auto;
      text-align: right;
    }

    .date-label {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .date-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .input-area {
      background: white;
      padding: 20px;
      border-left: 1px solid #e0e0e0;
      border-right: 1px solid #e0e0e0;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 80px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    input[type="text"], input[type="number"] {
      font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #111;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #111;
    }

    input::placeholder { color: #aaa; }

    .add-btn {
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 20px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
      line-height: 1;
    }

    .add-btn:hover { background: #333; }

    .table-wrap {
      background: white;
      border-left: 1px solid #e0e0e0;
      border-right: 1px solid #e0e0e0;
      border-bottom: 1px solid #e0e0e0;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
    }

    thead tr {
      background: #222;
      color: white;
    }

    thead th {
      padding: 11px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    tbody tr {
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody tr:nth-child(even) { background: #f8f8f8; }
    tbody tr:nth-child(even):hover { background: #f2f2f2; }

    tbody td {
      padding: 10px 14px;
      font-size: 14px;
      color: #111;
    }

    td.qty { text-align: center; font-weight: 600; }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .del-btn:hover { background: #fee; color: #e44; }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #aaa;
      font-size: 14px;
    }

    .footer {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .action-btn {
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 8px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-btn {
      background: white;
      color: #666;
      border: 1.5px solid #ddd;
    }

    .clear-btn:hover { border-color: #e44; color: #e44; }

    .pdf-btn {
      background: #111;
      color: white;
    }

    .pdf-btn:hover { background: #333; }

    .img-btn {
      background: #1a6b3a;
      color: white;
    }

    .img-btn:hover { background: #227a45; }

    .img-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .count-badge {
      background: #444;
      color: white;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }

    /* Print styles */
    @media print {
      body { background: white; padding: 0; }
      .input-area, .footer, .del-btn { display: none !important; }
      .header { border-radius: 0; }
      .table-wrap { border-radius: 0; border: none; }
      table { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <!-- Display mode -->
      <div class="header-title-wrap" id="title-display" onclick="startEditTitle()" title="Click to edit">
        <span id="title-emoji">🔧</span>
        <h1 id="title-text">Hardware Order List <span class="count-badge" id="count">0</span></h1>
        <span class="edit-hint">✏️</span>
      </div>
      <!-- Edit mode -->
      <div class="header-edit-row" id="title-edit">
        <input class="emoji-input" id="edit-emoji" type="text" maxlength="4" placeholder="🔧" />
        <input id="edit-title" type="text" placeholder="Hardware Order List" />
        <button class="save-title-btn" onclick="saveTitle()">✓ Save</button>
      </div>
      <div class="header-right">
        <div class="date-label">Date</div>
        <div class="date-value" id="today-date"></div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <input type="text" id="item" placeholder="Item (e.g. වඩිම්බු)" />
        <input type="number" id="qty" placeholder="Qty" min="1" />
        <input type="text" id="details" placeholder="Details (optional)" />
        <button class="add-btn" onclick="addItem()" title="Add">+</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Item</th>
            <th>Details</th>
            <th style="text-align:center">Qty</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="5" class="empty">Items නෑ. ඉහළින් add කරන්න 👆</td></tr>
        </tbody>
      </table>
    </div>

    <div class="footer">
      <button class="action-btn clear-btn" onclick="clearAll()">🗑 Clear All</button>
      <button class="action-btn img-btn" id="img-save-btn" onclick="saveAsImage()">🖼 Save as Image</button>
      <button class="action-btn pdf-btn" onclick="printPDF()">🖨 Print / PDF</button>
    </div>
  </div>

  <script>
    let items = [
      { item: "Side Flashing", qty: 9, details: "" },
      { item: "වඩිම්බු", qty: 10, details: "" },
      { item: "Gutter", qty: 1, details: "" },
      { item: "End Cap L/R", qty: 6, details: "L3 / R3" },
      { item: "Nossel", qty: 3, details: "" },
      { item: "Rivets", qty: 200, details: '1" × ½" — Same colour' },
      { item: "Silicon Small Tube", qty: 1, details: "" },
      { item: "Gutter Brackets", qty: 4, details: "nut and bolt 8" },
      { item: "Jaguar ඇන", qty: 30, details: "" },
    ];

    function render() {
      const tbody = document.getElementById('list-body');
      document.getElementById('count').textContent = items.length;

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">Items නෑ. ඉහළින් add කරන්න 👆</td></tr>';
        return;
      }

      tbody.innerHTML = items.map((it, i) => `
        <tr>
          <td style="color:#aaa;font-size:12px">${i + 1}</td>
          <td>${it.item}</td>
          <td style="color:#555">${it.details}</td>
          <td class="qty">${it.qty}</td>
          <td><button class="del-btn" onclick="deleteItem(${i})" title="Delete">✕</button></td>
        </tr>
      `).join('');
    }

    function addItem() {
      const item = document.getElementById('item').value.trim();
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const details = document.getElementById('details').value.trim();

      if (!item) {
        document.getElementById('item').focus();
        return;
      }

      items.push({ item, qty, details });
      document.getElementById('item').value = '';
      document.getElementById('qty').value = '';
      document.getElementById('details').value = '';
      document.getElementById('item').focus();
      render();
    }

    function deleteItem(i) {
      items.splice(i, 1);
      render();
    }

    function clearAll() {
      if (items.length === 0) return;
      if (confirm('සියලුම items delete කරන්නද?')) {
        items = [];
        render();
      }
    }

    function printPDF() {
      window.print();
    }

    async function saveAsImage() {
      const btn = document.getElementById('img-save-btn');
      btn.classList.add('loading');
      btn.textContent = '⏳ Generating...';

      // A4 at 96dpi = 794 × 1123 px
      const A4_W = 794;
      const A4_H = 1123;

      // Build a clean off-screen container styled like A4
      const wrapper = document.createElement('div');
      wrapper.style.cssText = `
        position: fixed; left: -9999px; top: 0;
        width: ${A4_W}px; min-height: ${A4_H}px;
        background: #ffffff;
        font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
        padding: 40px;
        box-sizing: border-box;
      `;

      // Clone just the app card (header + table)
      const appEl = document.querySelector('.app');
      const clone = appEl.cloneNode(true);

      // Remove edit UI, input area, footer, delete buttons from clone
      clone.querySelectorAll('.input-area, .footer, .del-btn, #title-edit, .edit-hint').forEach(el => el.remove());

      // Show title display in case edit mode was open
      const td = clone.querySelector('#title-display');
      if (td) td.style.display = 'flex';

      clone.style.cssText = 'max-width:100%; margin:0;';
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);

      try {
        const canvas = await html2canvas(wrapper, {
          width: A4_W,
          height: Math.max(A4_H, wrapper.scrollHeight + 80),
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          logging: false
        });

        // Crop/pad to exact A4 if shorter
        const finalCanvas = document.createElement('canvas');
        finalCanvas.width = A4_W * 2;
        finalCanvas.height = A4_H * 2;
        const ctx = finalCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
        ctx.drawImage(canvas, 0, 0);

        const link = document.createElement('a');
        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        link.download = `hardware-order-${dateStr}.png`;
        link.href = finalCanvas.toDataURL('image/png');
        link.click();
      } finally {
        document.body.removeChild(wrapper);
        btn.classList.remove('loading');
        btn.innerHTML = '🖼 Save as Image';
      }
    }

    let titleText = 'Hardware Order List';
    let titleEmoji = '🔧';

    function startEditTitle() {
      document.getElementById('title-display').style.display = 'none';
      document.getElementById('title-edit').style.display = 'flex';
      document.getElementById('edit-emoji').value = titleEmoji;
      document.getElementById('edit-title').value = titleText;
      document.getElementById('edit-title').focus();
    }

    function saveTitle() {
      const newEmoji = document.getElementById('edit-emoji').value.trim() || '🔧';
      const newTitle = document.getElementById('edit-title').value.trim() || 'Hardware Order List';
      titleEmoji = newEmoji;
      titleText = newTitle;
      document.getElementById('title-emoji').textContent = newEmoji;
      document.getElementById('title-text').innerHTML = newTitle + ' <span class="count-badge" id="count">' + items.length + '</span>';
      document.getElementById('title-edit').style.display = 'none';
      document.getElementById('title-display').style.display = 'flex';
    }

    // Allow Enter to save title
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('title-edit').style.display === 'flex') {
        saveTitle();
        return;
      }
      if (e.key === 'Enter') {
        if (document.getElementById('title-edit').style.display === 'flex') {
          saveTitle();
        } else {
          addItem();
        }
      }
    });

    // Show today's date
    function setDate() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('today-date').textContent = now.toLocaleDateString('en-GB', options);
    }

    setDate();
    render();
  </script>
</body>
</html>
