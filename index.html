<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Box Bar Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --steel:#23262b;
    --steel-2:#2f333a;
    --rivet:#c9962f;
    --rivet-dim:#8a6a24;
    --paper:#f3efe4;
    --paper-line:#d8d0ba;
    --ink:#1f3a8f;
    --ink-soft:#3a4f9c;
    --text-dim:#a9adb4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--steel);
    font-family:'Inter','Noto Sans Sinhala',sans-serif;
    min-height:100vh;
    padding:20px 16px 44px;
    color:#e7e7e5;
  }

  /* ===================================================== */
  /* BBC SCOPE — Box Bar Calculator (full recovered app)     */
  /* ===================================================== */
  .bbc-scope{
    --bbc-bg:#f4f4f9; --bbc-card:#ffffff; --bbc-text:#333333; --bbc-muted:#888888;
    --bbc-border:#cccccc; --bbc-input-bg:#ffffff; --bbc-result-bg:#e9ecef;
    --bbc-primary:#007bff; --bbc-danger:#dc3545; --bbc-whatsapp:#25D366;
    background:var(--bbc-bg);
    border-radius:10px;
    padding:16px;
  }
  .bbc-scope.bbc-dark{
    --bbc-bg:#121212; --bbc-card:#1e1e1e; --bbc-text:#f0f0f0; --bbc-muted:#aaaaaa;
    --bbc-border:#444444; --bbc-input-bg:#2a2a2a; --bbc-result-bg:#2a2a2a;
  }
  .bbc-scope .bbc-app{ max-width:420px; margin:0 auto; color:var(--bbc-text); }
  .bbc-scope .bbc-card{ background:var(--bbc-card); padding:18px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); margin-bottom:15px; }
  .bbc-scope .bbc-header-row{ display:flex; justify-content:space-between; align-items:center; }
  .bbc-scope h2{ text-align:center; color:var(--bbc-text); margin:0; flex:1; }
  .bbc-scope h2 small{ display:block; font-size:12px; font-weight:normal; color:var(--bbc-muted); margin-top:4px; }
  .bbc-scope h3{ margin-top:0; color:var(--bbc-text); font-size:16px; }
  .bbc-scope .bbc-theme-btn{ background:none; border:1px solid var(--bbc-border); color:var(--bbc-text); border-radius:50%; width:38px; height:38px; font-size:16px; cursor:pointer; flex-shrink:0; }
  .bbc-scope label{ font-weight:bold; display:block; margin-top:12px; font-size:14px; color:var(--bbc-text); }
  .bbc-scope .input-group{ display:flex; gap:10px; }
  .bbc-scope .input-box{ flex:1; }
  .bbc-scope input, .bbc-scope select{
    width:100%; padding:11px; margin-top:5px; font-size:16px;
    border:1px solid var(--bbc-border); border-radius:6px; box-sizing:border-box;
    background:var(--bbc-input-bg); color:var(--bbc-text);
    font-family:'Inter','Noto Sans Sinhala',sans-serif;
  }
  .bbc-scope button{ width:100%; border:none; padding:12px; margin-top:12px; font-size:16px; border-radius:6px; cursor:pointer; font-weight:bold; font-family:inherit; }
  .bbc-scope .bbc-btn-primary{ background:var(--bbc-primary); color:white; }
  .bbc-scope .bbc-btn-whatsapp{ background:var(--bbc-whatsapp); color:white; }
  .bbc-scope .bbc-btn-secondary{ background:transparent; border:1px solid var(--bbc-border); color:var(--bbc-text); }
  .bbc-scope .bbc-btn-danger{ background:transparent; color:var(--bbc-danger); border:1px solid var(--bbc-danger); padding:6px 10px; margin-top:0; font-size:13px; width:auto; }
  .bbc-scope .result{ margin-top:15px; padding:12px; background:var(--bbc-result-bg); border-radius:6px; }
  .bbc-scope .result p{ margin:6px 0; font-size:15px; color:var(--bbc-text); }
  .bbc-scope .bbc-item-row{ background:var(--bbc-result-bg); border-radius:8px; padding:10px 12px; margin-top:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .bbc-scope .bbc-item-info{ font-size:14px; line-height:1.4; color:var(--bbc-text); }
  .bbc-scope .bbc-item-info b{ font-size:15px; }
  .bbc-scope .bbc-grand-total{ font-size:18px; text-align:center; margin-top:10px; padding:12px; background:var(--bbc-primary); color:white; border-radius:8px; }
  .bbc-scope .bbc-hist-entry{ border:1px solid var(--bbc-border); border-radius:8px; padding:10px; margin-top:10px; }
  .bbc-scope .bbc-hist-entry .bbc-row{ display:flex; justify-content:space-between; align-items:center; }
  .bbc-scope .bbc-hist-buttons{ display:flex; gap:8px; margin-top:8px; }
  .bbc-scope .bbc-hist-buttons button{ margin-top:0; padding:8px; font-size:13px; }
  .bbc-scope .bbc-empty-msg{ color:var(--bbc-muted); text-align:center; font-size:14px; padding:10px 0; }
  .bbc-scope .bbc-two-col{ display:flex; gap:10px; }
  .bbc-scope .bbc-two-col > div{ flex:1; }
  .bbc-scope .bbc-tab-bar{ display:flex; gap:8px; margin-bottom:15px; }
  .bbc-scope .bbc-tab-btn{ flex:1; margin-top:0; padding:10px; background:var(--bbc-card); color:var(--bbc-text); border:1px solid var(--bbc-border); font-size:15px; }
  .bbc-scope .bbc-tab-btn.active{ background:var(--bbc-primary); color:white; border-color:var(--bbc-primary); }
  .bbc-scope .bbc-tab-panel{ display:none; }
  .bbc-scope .bbc-tab-panel.active{ display:block; }

</style>
</head>
<body>


<!-- ================= BBC TAB (Box Bar Calculator, full app) ================= -->
<div id="tab-bbc" class="bbc-scope">
  <div class="bbc-app">

    <div class="bbc-card bbc-header-row">
      <div style="width:38px;"></div>
      <h2>Box Bar Calculator<small>by VisHArTs</small></h2>
      <button class="bbc-theme-btn" id="bbcThemeToggle" onclick="bbcToggleTheme()">🌙</button>
    </div>

    <div class="bbc-tab-bar">
      <button class="bbc-tab-btn active" id="bbcTabBtnSimple" onclick="bbcSwitchTab('simple')">Simple</button>
      <button class="bbc-tab-btn" id="bbcTabBtnAdvanced" onclick="bbcSwitchTab('advanced')">Advanced</button>
    </div>

    <!-- SIMPLE TAB -->
    <div class="bbc-tab-panel active" id="bbcTabSimple">
      <div class="bbc-card">
        <label>මුළු දිග (Length):</label>
        <div class="input-group">
          <div class="input-box">
            <input type="number" id="bbc_s_feetQty" placeholder="අඩි (e.g. 3)" step="any" oninput="bbcSimpleCalculate(true)">
          </div>
          <div class="input-box">
            <input type="number" id="bbc_s_inchQty" placeholder="අඟල් (e.g. 6)" step="any" oninput="bbcSimpleCalculate(true)">
          </div>
        </div>

        <label>එක් බටයක දිග (අඩි):</label>
        <input type="number" id="bbc_s_barLength" value="18" oninput="bbcSimpleCalculate(true)">

        <label>එක් බටයක මිල (රු.):</label>
        <input type="number" id="bbc_s_barPrice" placeholder="e.g. 2500" step="any" oninput="bbcSimpleCalculate(true)">

        <div class="result" id="bbc_s_output" style="display:none;">
          <p><b>සම්පූර්ණ ප්‍රමාණය:</b> <span id="bbc_s_totalFeet"></span> Feet</p>
          <p><b>මිලදී ගත යුතු බට ගණන:</b> <span id="bbc_s_buyBars"></span></p>
          <p><b>ඉතිරි වන ප්‍රමාණය:</b> <span id="bbc_s_remainingFeet"></span> Feet</p>
          <p id="bbc_s_costRow" style="display:none;"><b>මුළු මිල:</b> රු. <span id="bbc_s_totalCost"></span></p>
        </div>
      </div>
    </div>

    <!-- ADVANCED TAB -->
    <div class="bbc-tab-panel" id="bbcTabAdvanced">

      <div class="bbc-card">
        <h3>Job විස්තර</h3>
        <div class="bbc-two-col">
          <div>
            <label>දිනය:</label>
            <input type="date" id="bbcJobDate">
          </div>
          <div>
            <label>ස්ථානය:</label>
            <input type="text" id="bbcJobLocation" placeholder="e.g. Matale site">
          </div>
        </div>
      </div>

      <div class="bbc-card">
        <h3>අයිතමය එකතු කරන්න</h3>

        <label>Box Bar Size:</label>
        <select id="bbcBarType" onchange="bbcHandleSizeChange()">
          <option value="1&quot; x 1&quot;" data-len="20">1" x 1"</option>
          <option value="1&quot; x 1.5&quot;" data-len="20">1" x 1.5"</option>
          <option value="1&quot; x 2&quot;" data-len="20">1" x 2"</option>
          <option value="1.5&quot; x 1.5&quot;" data-len="20">1.5" x 1.5"</option>
          <option value="2&quot; x 2&quot;" data-len="20">2" x 2"</option>
          <option value="2&quot; x 1&quot;" data-len="20">2" x 1"</option>
          <option value="2&quot; x 3&quot;" data-len="20">2" x 3"</option>
          <option value="2&quot; x 4&quot;" data-len="20">2" x 4"</option>
          <option value="3&quot; x 3&quot;" data-len="20">3" x 3"</option>
          <option value="__add_new__" data-len="20">+ අලුත් size එකක් Add කරන්න</option>
        </select>

        <label>මුළු දිග (Length):</label>
        <div class="input-group">
          <div class="input-box">
            <input type="number" id="bbcFeetQty" placeholder="අඩි (e.g. 3)" step="any" oninput="bbcLivePreview()">
          </div>
          <div class="input-box">
            <input type="number" id="bbcInchQty" placeholder="අඟල් (e.g. 6)" step="any" oninput="bbcLivePreview()">
          </div>
        </div>

        <label>එක් බටයක දිග (අඩි):</label>
        <input type="number" id="bbcBarLength" value="20" oninput="bbcLivePreview()">

        <label>Waste % (cutting loss):</label>
        <input type="number" id="bbcWastePct" value="0" step="any" placeholder="e.g. 3" oninput="bbcLivePreview()">

        <label>එක් බටයක මිල (රු.):</label>
        <input type="number" id="bbcBarPrice" placeholder="e.g. 2500" step="any" oninput="bbcLivePreview()">

        <div class="result" id="bbcLivePreviewBox" style="display:none; margin-top:12px;"></div>

        <button class="bbc-btn-primary" onclick="bbcAddItem()">+ අයිතමය එකතු කරන්න</button>
      </div>

      <div class="bbc-card" id="bbcItemsCard" style="display:none;">
        <h3>අයිතම ලැයිස්තුව</h3>
        <div id="bbcItemsList"></div>
        <div class="bbc-grand-total" id="bbcGrandTotal"></div>
        <button class="bbc-btn-whatsapp" onclick="bbcShareWhatsapp()">📱 WhatsApp වලින් Share කරන්න</button>
        <button class="bbc-btn-primary" onclick="bbcSaveToHistory()">💾 History එකට Save කරන්න</button>
        <button class="bbc-btn-secondary" onclick="bbcClearItems()">🗑 අලුතින් පටන් ගන්න</button>
      </div>

      <div class="bbc-card">
        <h3>History</h3>
        <div id="bbcHistoryList"><p class="bbc-empty-msg">Saved quotations නෑ තාම</p></div>
      </div>

    </div>
  </div>
</div>

<script>
  /* ===================================================== */
  /* BBC SCRIPT — Box Bar Calculator (full recovered app)    */
  /* ===================================================== */
  let bbcItems = [];

  function bbcSwitchTab(tab) {
    document.getElementById('bbcTabSimple').classList.toggle('active', tab === 'simple');
    document.getElementById('bbcTabAdvanced').classList.toggle('active', tab === 'advanced');
    document.getElementById('bbcTabBtnSimple').classList.toggle('active', tab === 'simple');
    document.getElementById('bbcTabBtnAdvanced').classList.toggle('active', tab === 'advanced');
    localStorage.setItem('boxbar_last_tab', tab);
  }

  function bbcComputeItem(feet, inches, barLen, wastePct, barPrice, type) {
    let totalInchesInput = (feet * 12) + inches;
    let totalFeet = totalInchesInput / 12;
    let totalFeetWithWaste = totalFeet * (1 + (wastePct / 100));
    let barFraction = totalFeetWithWaste / barLen;
    let buyBars = Math.ceil(barFraction);
    let remainingFeet = (buyBars * barLen) - totalFeetWithWaste;
    let cost = buyBars * barPrice;
    return { type, totalFeet, totalFeetWithWaste, barLen, buyBars, remainingFeet, barPrice, cost };
  }

  /* ---------- SIMPLE TAB ---------- */
  function bbcSimpleCalculate(silent) {
    let feet = parseFloat(document.getElementById('bbc_s_feetQty').value) || 0;
    let inches = parseFloat(document.getElementById('bbc_s_inchQty').value) || 0;
    let barLen = parseFloat(document.getElementById('bbc_s_barLength').value) || 20;
    let barPrice = parseFloat(document.getElementById('bbc_s_barPrice').value) || 0;

    if ((feet + inches) <= 0) {
      document.getElementById('bbc_s_output').style.display = 'none';
      if (!silent) alert("කරුණාකර අඩි හෝ අඟල් ගණන ඇතුළත් කරන්න.");
      return;
    }

    let r = bbcComputeItem(feet, inches, barLen, 0, barPrice, '');

    document.getElementById('bbc_s_totalFeet').innerText = r.totalFeet.toFixed(2);
    document.getElementById('bbc_s_buyBars').innerText = r.buyBars + " ක් (අඩි " + (r.buyBars * barLen) + ")";
    document.getElementById('bbc_s_remainingFeet').innerText = r.remainingFeet.toFixed(2);

    if (barPrice > 0) {
      document.getElementById('bbc_s_totalCost').innerText = r.cost.toLocaleString('en-LK');
      document.getElementById('bbc_s_costRow').style.display = 'block';
    } else {
      document.getElementById('bbc_s_costRow').style.display = 'none';
    }

    document.getElementById('bbc_s_output').style.display = 'block';
  }

  /* ---------- ADVANCED TAB ---------- */
  function bbcApplyPreset() {
    let sel = document.getElementById('bbcBarType');
    let len = sel.options[sel.selectedIndex].getAttribute('data-len');
    document.getElementById('bbcBarLength').value = len;
  }

  function bbcHandleSizeChange() {
    let sel = document.getElementById('bbcBarType');
    if (sel.value === '__add_new__') {
      let newSize = prompt("අලුත් size එක type කරන්න (e.g. 1.5\" x 2\"):");
      if (newSize && newSize.trim()) {
        bbcAddCustomSize(newSize.trim());
        sel.value = newSize.trim();
      } else {
        sel.selectedIndex = 0;
      }
    }
    bbcApplyPreset();
    bbcLivePreview();
  }

  function bbcLivePreview() {
    let feet = parseFloat(document.getElementById('bbcFeetQty').value) || 0;
    let inches = parseFloat(document.getElementById('bbcInchQty').value) || 0;
    let barLen = parseFloat(document.getElementById('bbcBarLength').value) || 20;
    let wastePct = parseFloat(document.getElementById('bbcWastePct').value) || 0;
    let barPrice = parseFloat(document.getElementById('bbcBarPrice').value) || 0;
    let box = document.getElementById('bbcLivePreviewBox');

    if ((feet + inches) <= 0) {
      box.style.display = 'none';
      return;
    }

    let r = bbcComputeItem(feet, inches, barLen, wastePct, barPrice, '');
    box.style.display = 'block';
    box.innerHTML = `<p><b>බට ගණන:</b> ${r.buyBars} (අඩි ${r.buyBars * barLen})</p>
        <p><b>ඉතිරි:</b> ${r.remainingFeet.toFixed(2)} අඩි</p>
        ${barPrice > 0 ? `<p><b>මිල:</b> රු. ${r.cost.toLocaleString('en-LK')}</p>` : ''}`;
  }

  function bbcAddCustomSize(sizeLabel) {
    let sizes = JSON.parse(localStorage.getItem('boxbar_custom_sizes') || '[]');
    if (!sizes.includes(sizeLabel)) {
      sizes.push(sizeLabel);
      localStorage.setItem('boxbar_custom_sizes', JSON.stringify(sizes));
    }
    bbcInsertSizeOption(sizeLabel);
  }

  function bbcInsertSizeOption(sizeLabel) {
    let sel = document.getElementById('bbcBarType');
    let exists = Array.from(sel.options).some(o => o.value === sizeLabel);
    if (exists) return;
    let opt = document.createElement('option');
    opt.value = sizeLabel;
    opt.text = sizeLabel;
    opt.setAttribute('data-len', '20');
    let addNewOpt = sel.querySelector('option[value="__add_new__"]');
    sel.insertBefore(opt, addNewOpt);
  }

  function bbcLoadCustomSizes() {
    let sizes = JSON.parse(localStorage.getItem('boxbar_custom_sizes') || '[]');
    sizes.forEach(s => bbcInsertSizeOption(s));
  }

  function bbcAddItem() {
    let feet = parseFloat(document.getElementById('bbcFeetQty').value) || 0;
    let inches = parseFloat(document.getElementById('bbcInchQty').value) || 0;
    let barLen = parseFloat(document.getElementById('bbcBarLength').value) || 20;
    let wastePct = parseFloat(document.getElementById('bbcWastePct').value) || 0;
    let barPrice = parseFloat(document.getElementById('bbcBarPrice').value) || 0;
    let type = document.getElementById('bbcBarType').value;

    if ((feet + inches) <= 0) {
      alert("කරුණාකර අඩි හෝ අඟල් ගණන ඇතුළත් කරන්න.");
      return;
    }

    let result = bbcComputeItem(feet, inches, barLen, wastePct, barPrice, type);
    bbcItems.push(result);
    bbcRenderItems();

    document.getElementById('bbcFeetQty').value = '';
    document.getElementById('bbcInchQty').value = '';
    document.getElementById('bbcBarPrice').value = '';
    document.getElementById('bbcLivePreviewBox').style.display = 'none';
  }

  function bbcRemoveItem(idx) {
    bbcItems.splice(idx, 1);
    bbcRenderItems();
  }

  function bbcRenderItems() {
    let card = document.getElementById('bbcItemsCard');
    let list = document.getElementById('bbcItemsList');
    if (bbcItems.length === 0) {
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';
    list.innerHTML = '';
    let grandBars = 0, grandCost = 0;

    bbcItems.forEach((it, idx) => {
      grandBars += it.buyBars;
      grandCost += it.cost;
      let div = document.createElement('div');
      div.className = 'bbc-item-row';
      div.innerHTML = `
          <div class="bbc-item-info">
              <b>${it.type}</b><br>
              දිග: ${it.totalFeet.toFixed(2)} අඩි | බට: ${it.buyBars} (${it.barLen} අඩි)<br>
              ඉතිරි: ${it.remainingFeet.toFixed(2)} අඩි${it.cost > 0 ? ' | රු. ' + it.cost.toLocaleString('en-LK') : ''}
          </div>
          <button class="bbc-btn-danger" onclick="bbcRemoveItem(${idx})">✕</button>
      `;
      list.appendChild(div);
    });

    document.getElementById('bbcGrandTotal').innerText =
      `මුළු බට: ${grandBars} | මුළු මිල: රු. ${grandCost.toLocaleString('en-LK')}`;
  }

  function bbcClearItems() {
    if (bbcItems.length && !confirm("සියලුම අයිතම ඉවත් කරන්නද?")) return;
    bbcItems = [];
    bbcRenderItems();
  }

  function bbcBuildSummaryText() {
    let date = document.getElementById('bbcJobDate').value || '-';
    let loc = document.getElementById('bbcJobLocation').value || '-';
    let lines = [`📋 *${loc}* - ${date}`, ''];
    let grandBars = 0, grandCost = 0;
    bbcItems.forEach((it, i) => {
      grandBars += it.buyBars;
      grandCost += it.cost;
      lines.push(`${i+1}. ${it.type} - ${it.buyBars} bars (${it.totalFeet.toFixed(1)} අඩි)${it.cost > 0 ? ' - රු.' + it.cost.toLocaleString('en-LK') : ''}`);
    });
    lines.push('');
    lines.push(`------------------`);
    lines.push(`මුළු බට: ${grandBars}`);
    lines.push(`මුළු මිල: රු. ${grandCost.toLocaleString('en-LK')}`);
    return lines.join('\n');
  }

  function bbcShareWhatsapp() {
    if (bbcItems.length === 0) { alert("කරුණාකර අයිතමයක් එකතු කරන්න."); return; }
    let text = bbcBuildSummaryText();
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  function bbcSaveToHistory() {
    if (bbcItems.length === 0) { alert("කරුණාකර අයිතමයක් එකතු කරන්න."); return; }
    let date = document.getElementById('bbcJobDate').value || new Date().toISOString().slice(0,10);
    let loc = document.getElementById('bbcJobLocation').value || '-';
    let grandCost = bbcItems.reduce((s, it) => s + it.cost, 0);
    let grandBars = bbcItems.reduce((s, it) => s + it.buyBars, 0);

    let history = JSON.parse(localStorage.getItem('boxbar_history') || '[]');
    history.unshift({
      date, loc, items: JSON.parse(JSON.stringify(bbcItems)), grandBars, grandCost,
      savedAt: new Date().toLocaleString()
    });
    localStorage.setItem('boxbar_history', JSON.stringify(history));
    bbcRenderHistory();
    alert("Save කළා ✅");
  }

  function bbcRenderHistory() {
    let history = JSON.parse(localStorage.getItem('boxbar_history') || '[]');
    let container = document.getElementById('bbcHistoryList');
    if (history.length === 0) {
      container.innerHTML = '<p class="bbc-empty-msg">Saved quotations නෑ තාම</p>';
      return;
    }
    container.innerHTML = '';
    history.forEach((h, idx) => {
      let div = document.createElement('div');
      div.className = 'bbc-hist-entry';
      div.innerHTML = `
          <div class="bbc-row">
              <div><b>${h.loc}</b> — ${h.date}</div>
              <div>රු. ${h.grandCost.toLocaleString('en-LK')}</div>
          </div>
          <div class="bbc-hist-buttons">
              <button class="bbc-btn-secondary" onclick="bbcLoadHistory(${idx})">Load</button>
              <button class="bbc-btn-danger" onclick="bbcDeleteHistory(${idx})">Delete</button>
          </div>
      `;
      container.appendChild(div);
    });
  }

  function bbcLoadHistory(idx) {
    let history = JSON.parse(localStorage.getItem('boxbar_history') || '[]');
    let h = history[idx];
    if (!h) return;
    document.getElementById('bbcJobDate').value = h.date;
    document.getElementById('bbcJobLocation').value = h.loc;
    bbcItems = JSON.parse(JSON.stringify(h.items));
    bbcRenderItems();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function bbcDeleteHistory(idx) {
    if (!confirm("මේ record එක delete කරන්නද?")) return;
    let history = JSON.parse(localStorage.getItem('boxbar_history') || '[]');
    history.splice(idx, 1);
    localStorage.setItem('boxbar_history', JSON.stringify(history));
    bbcRenderHistory();
  }

  /* ---------- SHARED (BBC) ---------- */
  function bbcToggleTheme() {
    let isDark = document.getElementById('tab-bbc').classList.toggle('bbc-dark');
    localStorage.setItem('boxbar_theme', isDark ? 'dark' : 'light');
    document.getElementById('bbcThemeToggle').innerText = isDark ? '☀️' : '🌙';
  }

  function bbcInitTheme() {
    let saved = localStorage.getItem('boxbar_theme');
    if (saved === 'dark') {
      document.getElementById('tab-bbc').classList.add('bbc-dark');
      document.getElementById('bbcThemeToggle').innerText = '☀️';
    }
  }

  bbcInitTheme();
  bbcRenderHistory();
  bbcLoadCustomSizes();
</script>
</body>
</html>
